services:
  postgres:
    image: postgres:16-alpine
    container_name: interviewprepai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-interviewprepai}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - interviewprepai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  interviewprepai_pgdata:
