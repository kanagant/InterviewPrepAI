spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

anthropic.api-key=test
anthropic.model=claude-sonnet-5
anthropic.base-url=https://api.anthropic.com/v1/messages
anthropic.max-tokens=4096
anthropic.version=2023-06-01
anthropic.oa-max-searches=5
anthropic.max-tokens-oa=8192

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
app.frontend-url=http://localhost:5173
app.jwt.secret=test-secret-value-that-is-at-least-32-bytes-long
app.jwt.expiration-minutes=10080
